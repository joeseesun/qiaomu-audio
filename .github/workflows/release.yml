name: Draft release
on:
  push:
    tags: ['[0-9]*']
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm run check
      - name: Verify version
        run: node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("manifest.json")).version!==process.env.GITHUB_REF_NAME)process.exit(1)'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Prepare draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css scripts/install-local-runtime.py --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/release-$GITHUB_REF_NAME.md"
